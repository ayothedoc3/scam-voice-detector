services:
  - type: web
    name: voice-scam-detector-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RESEMBLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["*"]'
    healthCheckPath: /api/v1/health
